{% extends "base.html" %}

{% block title %}BFPME Chatbot{% endblock %}

{% block extra_head %}
<style>
  .chat-container {
    height: calc(100vh - 12rem);
    max-width: 800px;
    margin: 0 auto;
    border: 1px solid #e2e8f0;
    border-radius: 0.5rem;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 1rem;
  }
  
  .message {
    margin-bottom: 1rem;
    padding: 0.75rem 1rem;
    border-radius: 0.5rem;
    max-width: 80%;
  }
  
  .user-message {
    background-color: #0ea5e9;
    color: white;
    margin-left: auto;
  }
  
  .bot-message {
    background-color: #f1f5f9;
    color: #0f172a;
  }
  
  /* Add styles for markdown elements */
  .bot-message h3 {
    font-size: 1.25rem;
    font-weight: bold;
    margin-top: 1rem;
    margin-bottom: 0.5rem;
    color: #1e40af;
  }
  
  .bot-message h4 {
    font-size: 1.1rem;
    font-weight: bold;
    margin-top: 0.75rem;
    margin-bottom: 0.5rem;
  }
  
  .bot-message ul {
    list-style-type: disc;
    margin-left: 1.5rem;
    margin-bottom: 0.75rem;
  }
  
  .bot-message ul ul {
    list-style-type: circle;
    margin-top: 0.25rem;
  }
  
  .bot-message p {
    margin-bottom: 0.75rem;
  }
  
  .bot-message strong {
    font-weight: 600;
  }
  
  .bot-message hr {
    margin: 1rem 0;
    border: 0;
    border-top: 1px solid #e2e8f0;
  }
</style>
{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-6">
  <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">BFPME Assistant</h1>
  
  <div class="chat-container bg-white shadow-md">
    <div id="chatMessages" class="chat-messages">
      <div class="message bot-message">
        <p>Bonjour ! Je suis l'assistant virtuel de BFPME. Comment puis-je vous aider aujourd'hui ?</p>
      </div>
    </div>
    
    <div class="chat-input-area bg-gray-100 p-4">
      <form id="chatForm" class="flex">
        <input 
          type="text" 
          id="userInput" 
          class="flex-1 border border-gray-300 rounded-l-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" 
          placeholder="Tapez votre message ici..."
        >
        <button 
          type="submit" 
          class="bg-[#132247] text-white px-4 py-2 rounded-r-lg hover:bg-[#1a2f5a]"
        >
          Envoyer
        </button>
      </form>
    </div>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    const chatForm = document.getElementById('chatForm');
    const userInput = document.getElementById('userInput');
    const chatMessages = document.getElementById('chatMessages');
    
    chatForm.addEventListener('submit', function(event) {
      event.preventDefault();
      
      const message = userInput.value.trim();
      if (!message) return;
      
      // Add user message to chat
      addMessage(message, true);
      
      // Clear input
      userInput.value = '';
      
      // Show loading indicator
      const loadingId = addLoadingMessage();
      
      // Send message to API
      fetch('/chat', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ message: message })
      })
      .then(response => response.json())
      .then(data => {
        // Remove loading message
        removeLoadingMessage(loadingId);
        
        // Add bot response
        addMessage(data.response, false);
      })
      .catch(error => {
        console.error('Error:', error);
        removeLoadingMessage(loadingId);
        addMessage("Désolé, une erreur s'est produite. Veuillez réessayer plus tard.", false);
      });
    });
    
    function addMessage(text, isUser) {
      const messageDiv = document.createElement('div');
      messageDiv.className = isUser ? 'message user-message' : 'message bot-message';
      
      if (isUser) {
        const paragraph = document.createElement('p');
        paragraph.textContent = text;
        messageDiv.appendChild(paragraph);
      } else {
        // Process markdown in bot responses
        messageDiv.innerHTML = parseMarkdown(text);
      }
      
      chatMessages.appendChild(messageDiv);
      
      // Scroll to bottom
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }
    
    function parseMarkdown(text) {
      // Convert Markdown to HTML
      let html = text;
      
      // Process headers
      html = html.replace(/### (.*?)(\n|$)/g, '<h3>$1</h3>$2');
      html = html.replace(/#### (.*?)(\n|$)/g, '<h4>$1</h4>$2');
      
      // Process bold
      html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      
      // Process horizontal rules
      html = html.replace(/---+/g, '<hr>');
      
      // Process numbered lists - handle patterns like "1. text" or "1. text\n2. text"
      html = html.replace(/^(\d+)\.\s+(.+)$/gm, '<div class="numbered-item"><span class="number">$1.</span> $2</div>');
      
      // Process bullets (simple)
      const lines = html.split('\n');
      let inList = false;
      let inNestedList = false;
      
      for (let i = 0; i < lines.length; i++) {
        if (lines[i].trim().startsWith('- ')) {
          if (!inList) {
            lines[i] = '<ul>\n<li>' + lines[i].trim().substring(2) + '</li>';
            inList = true;
          } else if (lines[i].trim().startsWith('  - ')) {
            if (!inNestedList) {
              lines[i] = '<ul>\n<li>' + lines[i].trim().substring(4) + '</li>';
              inNestedList = true;
            } else {
              lines[i] = '<li>' + lines[i].trim().substring(4) + '</li>';
            }
          } else {
            if (inNestedList) {
              lines[i] = '</ul>\n<li>' + lines[i].trim().substring(2) + '</li>';
              inNestedList = false;
            } else {
              lines[i] = '<li>' + lines[i].trim().substring(2) + '</li>';
            }
          }
        } else {
          if (inNestedList) {
            lines[i] = '</ul>\n' + lines[i];
            inNestedList = false;
          }
          if (inList && lines[i].trim() !== '') {
            lines[i] = '</ul>\n' + lines[i];
            inList = false;
          } else if (inList && i < lines.length - 1 && !lines[i+1].trim().startsWith('- ')) {
            lines[i] = '</ul>';
            inList = false;
          }
        }
      }
      
      if (inNestedList) {
        lines.push('</ul>');
      }
      if (inList) {
        lines.push('</ul>');
      }
      
      html = lines.join('\n');
      
      // Convert ALL remaining newlines to <br> (not just double newlines)
      html = html.replace(/\n/g, '<br>');
      
      return html;
    }
    
    function addLoadingMessage() {
      const id = 'loading-' + Date.now();
      const loadingDiv = document.createElement('div');
      loadingDiv.className = 'message bot-message';
      loadingDiv.id = id;
      
      const paragraph = document.createElement('p');
      paragraph.innerHTML = 'Réponse en cours...';
      
      loadingDiv.appendChild(paragraph);
      chatMessages.appendChild(loadingDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;
      
      return id;
    }
    
    function removeLoadingMessage(id) {
      const loadingDiv = document.getElementById(id);
      if (loadingDiv) {
        chatMessages.removeChild(loadingDiv);
      }
    }
  });
</script>
{% endblock %}
